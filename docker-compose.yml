# Nasazení (Raspberry Pi i jakýkoli server s Dockerem)
#
#   docker compose pull && docker compose up -d                     # web + databáze + zálohy
#   docker compose --profile tunnel up -d                            # + Cloudflare Tunnel
#
# Obraz se staví automaticky na GitHubu (amd64 i arm64), Pi ho jen stahuje.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastav POSTGRES_PASSWORD v .env}
      POSTGRES_DB: ${POSTGRES_DB:-mathex}
    # Šetrnější nastavení pro Raspberry Pi
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=30', '-c', 'effective_cache_size=512MB']
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/mathexresources/mathex.cz-v2:latest}
    # Kdybys chtěl stavět přímo na serveru: docker compose build web
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-mathex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mathex}
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - media:/app/media
    # Výchozí: jen lokálně (ven web pouští Cloudflare Tunnel nebo reverzní proxy).
    # WEB_BIND=0.0.0.0 v .env ho zpřístupní v domácí síti, např. http://192.168.0.101:3000
    ports:
      - '${WEB_BIND:-127.0.0.1}:3000:3000'
    mem_limit: 1g
    logging: *logging

  # Denní záloha databáze do ./backups (drží posledních 14 dní)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-mathex}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-mathex}
    volumes:
      - ./backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          f=/backups/db-$$(date +%Y-%m-%d).sql.gz
          pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "Záloha: $$f"
          find /backups -name 'db-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    mem_limit: 128m
    logging: *logging

  # Zveřejnění webu bez otevírání portů na routeru (zapni: --profile tunnel)
  cloudflared:
    profiles: ['tunnel']
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Nastav CLOUDFLARE_TUNNEL_TOKEN v .env}
    depends_on:
      - web
    mem_limit: 128m
    logging: *logging

volumes:
  db-data:
  media:
