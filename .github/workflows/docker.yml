# Postaví Docker obraz pro amd64 i arm64 (Raspberry Pi) a nahraje ho do
# GitHub Container Registry: ghcr.io/<vlastník>/<repozitář>:latest
# arm64 se staví nativně na ARM runneru – rychle, bez emulace.

name: Docker obraz

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  check:
    name: Typy a build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
        env:
          PAYLOAD_SECRET: ci
          DATABASE_URI: postgres://ci:ci@localhost:5432/ci
      - name: Unit testy
        run: npm test

  e2e:
    name: End-to-end testy
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          PAYLOAD_SECRET: ci
          DATABASE_URI: postgres://ci:ci@localhost:5432/ci
      - name: Statické soubory do standalone buildu
        run: cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
      - name: Prohlížeč pro testy
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CalDAV server pro testy kalendáře (Radicale)
        run: pip install radicale
      - name: Testy (rezervace, e-maily, kalendář, administrace, SEO)
        run: npx playwright test
        env:
          E2E_DATABASE_URI: postgres://postgres:postgres@localhost:5432/mathex_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-vysledky
          path: test-results/
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }}
    needs: [check, e2e]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Název obrazu malými písmeny
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Platforma pro název artefaktu
        run: echo "PAIR=${{ matrix.platform }}" | sed 's|/|-|g' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a push podle digestu
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Web Mathex (Next.js + Payload CMS)

      - name: Uložit digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Spojit do jednoho tagu
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Název obrazu malými písmeny
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Vytvořit manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Zkontrolovat
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
